# --- 1. Line Breaks ---
# Force a newline between the function name and the opening '('
nl_func_paren      = force   # For declarations
nl_func_def_paren  = force   # For definitions

# Force a newline after the opening '('
nl_func_decl_start = force   # For declarations
nl_func_def_start  = force   # For definitions

# Force a newline after every ',' in the parameter list
nl_func_decl_args  = force
nl_func_def_args   = force

# Force a newline before the closing ')'
nl_func_decl_end   = force
nl_func_def_end    = force

# ...but keep an empty parameter list glued to the name, as 'foo()'.
# The _empty options override nl_func_paren / nl_func_def_paren for functions
# with no parameters; nl_func_decl_empty / nl_func_def_empty kill the newline
# between the '(' and the ')'.
nl_func_paren_empty     = remove
nl_func_def_paren_empty = remove
nl_func_decl_empty      = remove
nl_func_def_empty       = remove

# No space left behind between the name and the empty '()'.
# The _class one covers a constructor/destructor without parameters.
sp_func_proto_paren_empty = remove
sp_func_def_paren_empty   = remove
sp_func_class_paren_empty = remove

# --- 2. Indentation & Alignment ---
# Align the parameters directly under the opening '('
indent_func_proto_param = false
indent_func_def_param   = false
indent_func_class_param = false

# Indent the '(' that sits on its own line one level past the function name.
# The closing ')' follows it for free via indent_paren_close = 1 below.
indent_paren_after_func_decl = true
indent_paren_after_func_def  = true

# Align the closing ')' directly under the opening '('
# 0: body level, 1: align under open paren, 2: brace level
indent_paren_close = 1

# One indent level = 4 columns, matching IndentWidth: 4 in .clang-format.
indent_columns = 4

# How wide an existing tab in the INPUT is counted. Nothing is emitted as a tab
# (see indent_with_tabs = 0 below), but a stray tab in a source file still has to
# be measured to get the column right, and that feeds code_width further down.
# Defaults to 8; 4 matches TabWidth: 4 in .clang-format.
input_tab_size  = 4

# Only consulted when align_with_tabs = true, which it is not. Kept at 4 so it
# cannot disagree with the rest if that is ever turned on.
output_tab_size = 4

# Indent of the parameters inside the '(' ... ')'.
# This is measured in COLUMNS from the brace level, not in levels, so with
# indent_columns = 4 above, 4 is one level -- putting the parameters level with
# the '(' that indent_paren_after_func_decl moved in.
# Use 8 instead to sink them one level deeper than the '('.
indent_continue = 4

# Spaces only. No tabs anywhere in the code.
#   0: spaces only
#   1: indent with tabs to brace level, align with spaces  <- uncrustify default
#   2: indent and align with tabs
# Note 1 (the DEFAULT) also emits tabs, so this has to be set explicitly; simply
# leaving the option out is not the same as asking for spaces.
indent_with_tabs = 0

# Indentation is not the only way a tab reaches the output: a tab already inside
# a comment is passed through untouched unless this is on.
cmt_convert_tab_to_spaces = true

# Alignment padding (trailing comments, consecutive '=') is a separate setting
# again. false is the default, but state it so nothing here can emit a tab.
align_with_tabs = false
align_keep_tabs = false
# Preprocessor lines have a tab setting of their own; it is set in section 8.

# --- 3. Function Definition Braces ---
# Force a newline before the opening '{' of a function definition
nl_fdef_brace = force

# Prevent collapsing single-line function bodies into a single line
# This ensures the '{' and '}' stay on separate lines even if the body is tiny
nl_func_leave_one_liners = false
nl_collapse_empty_body   = false

# Ensure the return type (int) stays on the same line as the class/function name
nl_func_type_name = remove


# --- 4. Constructor Initializer Lists ---
# Force a newline between the closing ')' of the constructor and the ':'
nl_constr_colon = force

# Place the ':' at the start of the new line
pos_constr_colon = lead

# Place the ',' at the start of the line for subsequent initializations
pos_constr_comma = lead

# Force a newline after each ',' in the initialization list
nl_constr_init_args = force

# Align the ':' and the ',' in the same column.
# This option does NOT lock the two together -- its actual meaning is "indent
# the stuff AFTER a leading class initializer colon", which pushed every ',' two
# columns right to line the member names up under the first one instead:
#     : mData( ... )
#       , mName( aName )
# Turning it off is what puts the ',' back under the ':'. The two spaces are
# indent_ctor_init_following (default 2), but that value is only consulted while
# this is true, so setting it to 0 alone changes nothing.
indent_constr_colon = false


# --- 5. Spaces Inside Parentheses ---
# This turns m_c(c) into m_c( c ). ('sp_inside_fcall' is not a real uncrustify
# option; it was silently ignored, which is why nothing happened.)
# Function calls and parameter lists use "fparen" tokens...
sp_inside_fparen  = force
sp_inside_fparens = remove   # but leave an empty '()' alone

# ...while a C++ named cast, a C-style cast and typeid() are plain parens, so
# static_cast<T>( p ) and typeid( T ) need these two instead.
sp_inside_paren      = force
sp_inside_paren_cast = force

# ')' immediately followed by ')' belongs to neither paren's inside, so the
# space between them is its own option: typeid( T ) ) rather than typeid( T )).
sp_paren_paren = force

# A lambda's parameter list is not an fparen either.
sp_cpp_lambda_argument_list       = force
sp_cpp_lambda_argument_list_empty = remove

# Control statements use "sparen" tokens. sp_inside_sparen covers if/while/
# switch/do-while/catch; 'for' is explicitly excluded from it and needs its own.
sp_inside_sparen = force
sp_inside_for    = force

# Keep the keyword glued to its '(': 'if( a )', not 'if ( a )'. One option
# covers if/for/while/switch/catch, since they share the sparen token.
sp_before_sparen = remove

# The '((' and '))' seam, as in 'if ( ( a && b ) || c )'.
sp_sparen_paren = force


# --- 6. C++11 Brace Initialization ---
# mDeleteLaterPosted{false} -> mDeleteLaterPosted { false }. Every form of
# braced init is one token type (BRACED_INIT_LIST), but the space BEFORE the '{'
# is split by what precedes it: a variable name vs. a type name.
sp_word_brace_init_lst = force   # mCount { 0 }
sp_type_brace_init_lst = force   # Foo { 1, 2 }, an unnamed temporary

# The spaces inside. Despite the option name mentioning unnamed temporaries,
# this covers named variables too -- they share the token.
# Its own docs note it works only while sp_brace_brace and
# sp_before_type_brace_init_lst_close are left at ignore, so do not set those.
sp_inside_type_brace_init_lst = force

# Nothing extra is needed for the "same line" part of this: when the braces are
# split across lines uncrustify has no space to place, so a multi-line init is
# left alone rather than gaining a trailing space.

# Ensure a space exists after the colon and comma
sp_after_constr_colon = force
sp_after_comma = force

# Ensure a space exists between a closing '>' and the name that follows it, so a
# SFINAE return type does not run into the function name:
#
#   static std::enable_if_t<is_obj<Receiver>, Connection>connect     <- without
#   static std::enable_if_t<is_obj<Receiver>, Connection> connect    <- with
#
# 'add' rather than 'force' on purpose. Both insert the missing space, but force
# also collapses a run of spaces to exactly one, which would break the aligned
# member declarations further down every class:
#
#   std::deque<EventPair>   mEventQueue;    <- kept by add, squashed by force
#   std::atomic<bool>       mInterrupt;
sp_angle_word = add


# --- 7. Line Width ---
# Max column width. 0 (the default) means no limit. Matches ColumnLimit: 100
# in .clang-format. Note it is a "try to", not a hard cap: uncrustify only
# breaks where it has a rule to break, and never splits a long string or name.
code_width = 100

# Split as close to code_width as possible instead of preferring an earlier,
# tidier boundary. Without this a long expression breaks at the first function
# call that fits, leaving the line well short of the limit.
ls_code_width = true

# code_width does not apply to comments; cmt_width would wrap those. Left at 0
# (off) on purpose: it re-wraps '//!' doc comments without carrying the '!' onto
# the continuation line, turning them into plain '//' and breaking Doxygen.
cmt_width = 0


# Whether to indent the body of a 'namespace'.
indent_namespace                = true    # true/false

# Whether to indent only the first namespace, and not any nested namespaces.
# Requires indent_namespace=true.
#
# Must stay false. With true, a nested namespace (the anonymous one at the top
# of Thread.cpp) leaves its own 'namespace' keyword in column 0 while indenting
# its body, and that inconsistency then breaks the continuation indent for the
# REST OF THE FILE: every wrapped parameter list after it drops back to brace
# level instead of lining up with its '('. false also matches
# NamespaceIndentation: Inner in .clang-format.
indent_namespace_single_indent  = false   # true/false

# Whether the 'class' body is indented.
indent_class                    = true    # true/false

# Indent a lambda's body relative to the lambda instead of leaving it at the
# brace level of the enclosing statement, so a lambda passed as a call argument
# gets its '{' under the '[' rather than two levels left of it.
indent_cpp_lambda_body = true

# Required alongside it. Continued call arguments otherwise align under the open
# '(' by column, and an inline '[]() {' lambda then indents its body to that
# column -- which lands off the tabstop and comes out as tabs plus stray spaces.
# true indents call arguments by whole levels instead, keeping everything tabs.
indent_func_call_param = true

# Always break between a lambda's signature and its '{', the way nl_fdef_brace
# does for functions. Left at the default (ignore) uncrustify keeps whatever the
# source had, which is why '[]() {' and '[]()\n{' both survived in the same file.
nl_cpp_ldef_brace = force


# --- 8. Preprocessor Directives ---
# Indent #if/#else/#endif to the brace level of the surrounding code instead of
# pinning them to column 1 (which is what false, the default, means).
# Nothing else is needed to keep file-level directives flush left: at brace
# level 0 the context indent IS 0, so include guards and the #if around the
# platform #includes stay in column 1 on their own.
pp_indent_at_level = true
pp_indent_count = 4
pp_indent = add
pp_if_indent_code = true

# Preprocessor lines have their OWN tab setting, and it must be 0 for a
# spaces-only codebase. Its default of -1 is documented as "use the
# indent_with_tabs setting", but that fallback does not honour 0: every indented
# #if/#else/#endif still came out tab-indented until this was set explicitly.
# NOTE: uncrustify takes the LAST assignment of an option in the file, so this
# must stay after any other pp_indent_with_tabs line.
pp_indent_with_tabs = 0

# indent_comment (default true) only covers comments that are NOT in the first
# column, so a banner written flush left stays flush left while the code beside
# it moves in. This is the switch for the first-column case.
indent_col1_comment             = true    # true/false

# Indent the content that comes *after* access specifiers
indent_access_spec_body = false

# Control the position of the access specifiers (public/private/protected)
#   0  = Align them flush with the class opening brace '{'
#   1  = Indent them slightly (e.g., 1 space)
#  -4  = Outdent them (use your negative indent size) so they stick out to the left
indent_access_spec = -4

# Blank line after every declaration. These are newline *counts*, so 2 == one
# blank line; 1 would just end the line.
# "func_class" means a class constructor/destructor; the _group variants apply
# when the prototype is *not* followed by another prototype of the same kind.
nl_after_func_proto             = 2
nl_after_func_proto_group       = 2
nl_after_func_class_proto       = 2
nl_after_func_class_proto_group = 2

# Leave the newlines *before* a prototype alone (0 = option disabled). Do not
# set these to 1: they fight nl_after_func_proto and win.
#
# Why: uncrustify runs two formatting loops. The first ends with do_blank_lines(),
# which is what honours nl_after_func_proto and puts the blank line in. The second
# loop re-wraps anything past code_width, and if it splits even one line it re-runs
# newlines_insert_blank_lines() -- which applies nl_before_*_proto -- without ever
# calling do_blank_lines() again. A value of 1 there means "exactly one newline
# before a prototype", so every blank line the first loop added is collapsed and
# never restored. The trigger here is nl_func_type_name = remove pulling a long
# enable_if_t<...> return type onto the same line as the function name, which
# pushes it past code_width; the whole file then loses its prototype blank lines,
# not just that declaration.
nl_before_func_body_proto  = 0
nl_before_func_class_proto = 0

# Blank line after the '}' of a function defined inside the class body, so an
# inline definition is separated from whatever follows just like a prototype is.
# _class overrides nl_after_func_body; _one_liner would override both, but
# nl_func_leave_one_liners = false means there are no one-liners left to catch.
nl_after_func_body_class = 2
